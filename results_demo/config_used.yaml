heads:
  GeMPoolClassifier:
    enabled: true
    hyperparameters:
      C:
      - 0.1
      - 1.0
      class_weight:
      - balanced
      p:
      - 2.0
      - 3.0
  MeanPoolClassifier:
    enabled: true
    hyperparameters:
      C:
      - 0.1
      - 1.0
      - 10.0
      class_weight:
      - balanced
search_strategy: grid
training:
  device: cpu
  random_seed: 42
  selection_metric: roc_auc
